name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Correr la suite de tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr la suite de tests
        run: python -m unittest discover -s tests -v

  cobertura:
    name: Medir cobertura de tests y actualizar el badge
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Correr los tests midiendo cobertura
        run: python -m coverage run -m unittest discover -s tests

      - name: Mostrar el resumen de cobertura
        run: python -m coverage report -m

      - name: Generar el reporte JSON de cobertura
        run: python -m coverage json

      - name: Generar el badge de cobertura
        run: python scripts/generar_badge_cobertura.py

      - name: Commitear el badge si cambio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar badge de cobertura [skip ci]"
          file_pattern: coverage.svg
